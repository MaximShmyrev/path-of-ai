  - id: data-alchemist
    title: "Алхимик данных"
    avatar_ref: "classes/data-alchemist.png"
    modifiers:
      ml-foundations: 1.10
  - id: model-mage
    title: "Маг моделей"
    avatar_ref: "classes/model-mage.png"
    modifiers:
      llm: 1.10
  - id: artifact-engineer
    title: "Инженер артефактов"
    avatar_ref: "classes/artifact-engineer.png"
    modifiers:
      agents: 1.10
      rag: 1.05

regions:
  # ── Регион 1: Основы ML ──────────────────────────────────────────────
  - id: ml-foundations
    title: "Долина основ машинного обучения"
    unlock_level: 1
    topics:
      - id: supervised-basics
        title: "Обучение с учителем"
        prerequisites: []
        events: true
        quests:
          - id: supervised-basics-theory
            title: "Свиток: что такое обучение с учителем"
            kind: theory
            xp: 50
            body: |
              ## Обучение с учителем
              Модель учится по **размеченным** примерам: на входе признаки `X`, на
              выходе известный ответ `y`. Цель — найти зависимость `X → y`, которая
              **обобщается** на новые, ещё не виденные данные.

              - **Классификация** предсказывает категорию (метку класса): спам / не спам.
              - **Регрессия** предсказывает число: цену, температуру.

              **Пример.** По росту и весу человека (`X`) предсказать пол (`y`) — это
              классификация: ответ — одна из категорий.

              **Ключевое.** Качество зависит от того, насколько обучающие примеры
              похожи на те, что встретятся в будущем.
          - id: supervised-basics-practice
            title: "Испытание: обучи классификатор"
            kind: practice
            xp: 150
            quiz:
              - prompt: "Что предсказывает модель классификации?"
                options: ["Непрерывное число", "Метку класса", "Случайный шум"]
                answer: 1
                explanation: "Классификация выдаёт дискретную категорию — метку класса. Непрерывное число предсказывает регрессия."
      - id: model-evaluation
        title: "Оценка моделей"
        prerequisites: ["supervised-basics"]
        quests:
          - id: model-evaluation-theory
            title: "Свиток: метрики качества"
            kind: theory
            xp: 50
            body: |
              ## Метрики качества
              «На глаз» качество модели не измерить. Базовые метрики классификации:

              - **Accuracy** — доля верных ответов. Обманчива при дисбалансе классов.
              - **Precision** — из предсказанных «положительных» сколько действительно верны.
              - **Recall** — из всех настоящих «положительных» сколько модель нашла.
              - **F1** — гармоническое среднее precision и recall.

              **Пример.** Если 99% людей здоровы и 1% больны, модель «всегда здоров»
              даёт accuracy 99%, но recall болезни = 0 — она бесполезна. Поэтому при
              дисбалансе смотрят на **F1**, а не на accuracy.
          - id: model-evaluation-practice
            title: "Испытание: выбери метрику для дисбаланса классов"
            kind: practice
            xp: 150
            quiz:
              - prompt: "Какая метрика устойчива к дисбалансу классов?"
                options: ["Accuracy", "F1-score", "Сумма ошибок"]
                answer: 1
                explanation: "F1 сочетает precision и recall, поэтому не «обманывается» дисбалансом, как accuracy."
      - id: feature-engineering
        title: "Признаки и данные"
        prerequisites: ["supervised-basics"]
        quests:
          - id: feature-engineering-theory
            title: "Свиток: подготовка признаков"
            kind: theory
            xp: 50
            body: |
              ## Подготовка признаков
              Модель видит мир через **признаки** (features) — числа, которыми описан
              объект. Часто качество признаков важнее выбора алгоритма.

              - **Масштабирование** (нормализация / стандартизация) приводит признаки
                к сравнимым диапазонам.
              - **Кодирование категорий** (one-hot и др.) превращает текстовые
                категории в числа.
              - **Пропуски и выбросы** обрабатывают до обучения.

              **Пример.** Признак «доход» в рублях и «возраст» в годах имеют разный
              масштаб; без нормализации методы на расстояниях и градиентах сходятся хуже.
          - id: feature-engineering-practice
            title: "Испытание: нормализуй признаки"
            kind: practice
            xp: 150
            quiz:
              - prompt: "Зачем масштабировать признаки?"
                options:
                  - "Чтобы модель быстрее и стабильнее сходилась"
                  - "Чтобы увеличить число строк"
                  - "Это никогда не нужно"
                answer: 0
                explanation: "Масштабирование уравнивает диапазоны признаков, и методы на градиентах/расстояниях работают стабильнее и быстрее."

  # ── Регион 2: Большие языковые модели ────────────────────────────────
  - id: llm
    title: "Цитадель больших языковых моделей"
    unlock_level: 2
    topics:
      - id: transformers
        title: "Трансформеры"
        prerequisites: ["model-evaluation"]
        quests:
          - id: transformers-theory
            title: "Свиток: механизм внимания"
            kind: theory
            xp: 50
            body: |
              ## Механизм внимания
              Трансформер обрабатывает последовательность токенов и для каждого решает,
              **на какие другие токены смотреть**. Это и есть **attention**: токену
              присваиваются веса важности всех остальных.

              - **Self-attention** — токены последовательности «смотрят» друг на друга,
                улавливая связи (какое слово к чему относится).
              - **Multi-head** — несколько «голов» внимания ловят разные типы связей.

              **Почему важно.** В отличие от рекуррентных сетей, внимание видит всю
              последовательность сразу и хорошо ловит дальние зависимости. На этом
              механизме построены все современные LLM.
          - id: transformers-practice
            title: "Испытание: разбери self-attention"
            kind: practice
            xp: 150
            quiz:
              - prompt: "Что вычисляет механизм внимания (attention)?"
                options:
                  - "Веса важности между токенами"
                  - "Градиент функции потерь"
                  - "Размер словаря"
                answer: 0
                explanation: "Attention оценивает, насколько каждый токен релевантен другим, — это веса важности между токенами."
      - id: prompting
        title: "Промптинг"
        prerequisites: ["transformers"]
        quests:
          - id: prompting-theory
            title: "Свиток: искусство промпта"
            kind: theory
            xp: 50
            body: |
              ## Искусство промпта
              Промпт — инструкция модели на естественном языке. Хороший промпт задаёт
              **роль, задачу, формат ответа и примеры**.

              - **Zero-shot** — только инструкция, без примеров.
              - **Few-shot** — в промпт добавляют несколько примеров «вход → выход», и
                модель улавливает паттерн.
              - **Chain-of-thought** — просим рассуждать пошагово для сложных задач.

              **Пример few-shot.** Дать 2–3 пары «отзыв → тональность», затем новый
              отзыв — модель продолжит в том же формате.
          - id: prompting-practice
            title: "Испытание: составь few-shot промпт"
            kind: practice
            xp: 150
            quiz:
              - prompt: "Что такое few-shot промптинг?"
                options:
                  - "Примеры в промпте перед задачей"
                  - "Обучение модели с нуля"
                  - "Уменьшение числа параметров"
                answer: 0
                explanation: "Few-shot — это несколько примеров прямо в промпте; модель схватывает формат по ним, веса при этом не меняются."
      - id: fine-tuning
        title: "Дообучение моделей"
        prerequisites: ["transformers"]
        events: true
        quests:
          - id: fine-tuning-theory
            title: "Свиток: когда дообучать"
            kind: theory
            xp: 50
            body: |
              ## Когда дообучать
              Адаптировать модель под задачу можно по нарастающей стоимости:

              1. **Промптинг / few-shot** — дёшево, без обучения.
              2. **RAG** — подмешать свои знания через поиск.
              3. **Fine-tuning** — дообучить веса на своих данных (нужны датасет и ресурсы).
              4. **Обучение с нуля** — крайне дорого, почти никогда не нужно.

              **LoRA** (параметро-эффективное дообучение) меняет лишь небольшую добавку
              к весам — дёшево и без порчи базовой модели.

              **Правило.** Начинай с промптинга/RAG; дообучай, только когда этого не хватает.
          - id: fine-tuning-practice
            title: "Испытание: подготовь датасет для дообучения"
            kind: practice
            xp: 150
            quiz:
              - prompt: "Что обычно дешевле для адаптации под задачу?"
                options: ["Промптинг/RAG", "Полное переобучение", "Смена архитектуры"]
                answer: 0
                explanation: "Промптинг и RAG не трогают веса модели, поэтому дешевле полного переобучения — с них и начинают."
          - id: fine-tuning-boss
            title: "Босс: защити выбор стратегии адаптации"
            kind: boss
            xp: 300
            quiz:
              - prompt: "LoRA — это про что?"
                options:
                  - "Параметро-эффективное дообучение"
                  - "Алгоритм поиска"
                  - "Формат файла"
                answer: 0
                explanation: "LoRA (low-rank adaptation) дообучает небольшую низкоранговую добавку к весам — это параметро-эффективный fine-tuning."

  # ── Регион 3: RAG и поиск ────────────────────────────────────────────
  - id: rag
    title: "Библиотека RAG и поиска знаний"
    unlock_level: 4
    topics:
      - id: embeddings
        title: "Эмбеддинги"
        prerequisites: ["prompting"]
        quests:
          - id: embeddings-theory
            title: "Свиток: векторные представления"
            kind: theory
            xp: 50
            body: |
              ## Векторные представления
              Эмбеддинг — представление текста (слова, предложения, документа) в виде
              **вектора чисел**, где близкие по смыслу объекты лежат рядом в пространстве.

              - Сходство смысла измеряют **косинусной близостью** векторов.
              - Эмбеддинги — основа смыслового поиска, кластеризации, рекомендаций и RAG.

              **Пример.** «кот» и «кошка» дадут близкие векторы; «кот» и «экскаватор» —
              далёкие. Модель оперирует смыслом, а не буквами.
          - id: embeddings-practice
            title: "Испытание: посчитай близость векторов"
            kind: practice
            xp: 150
            quiz:
              - prompt: "Что измеряет косинусная близость эмбеддингов?"
                options: ["Смысловую похожесть", "Длину строки", "Число токенов"]
                answer: 0
                explanation: "Косинусная близость отражает угол между векторами: чем он меньше, тем ближе смысл текстов."
      - id: vector-search
        title: "Векторный поиск"
        prerequisites: ["embeddings"]
        quests:
          - id: vector-search-theory
            title: "Свиток: ANN и индексы"
            kind: theory
            xp: 50
            body: |
              ## ANN и индексы
              Чтобы искать по смыслу среди миллионов эмбеддингов, нужен быстрый поиск
              ближайших соседей. Точный перебор слишком медленный, поэтому применяют
              **ANN** (approximate nearest neighbors) — приближённый поиск.

              - **Индексы** (HNSW, IVF и др.) заранее организуют векторы для скорости.
              - **top-k** — запрос возвращает `k` самых близких объектов.

              **Компромисс.** ANN жертвует крупицей точности ради огромного выигрыша
              в скорости — для поиска по смыслу это почти всегда оправдано.
          - id: vector-search-practice
            title: "Испытание: подбери top-k для поиска"
            kind: practice
            xp: 150
            quiz:
              - prompt: "Что возвращает поиск top-k по векторам?"
                options:
                  - "k наиболее близких документов"
                  - "Случайные k документов"
                  - "Все документы"
                answer: 0
                explanation: "top-k отдаёт k объектов с наибольшей близостью к запросу — самых релевантных, а не случайных."
      - id: rag-pipeline
        title: "RAG-конвейер"
        prerequisites: ["vector-search"]
        events: true
        quests:
          - id: rag-pipeline-theory
            title: "Свиток: retrieve → augment → generate"
            kind: theory
            xp: 50
            body: |
              ## retrieve → augment → generate
              RAG соединяет поиск и генерацию, чтобы LLM отвечала по **вашим** данным:

              1. **Retrieve** — по вопросу находим релевантные фрагменты (эмбеддинги +
                 векторный поиск).
              2. **Augment** — вставляем найденный контекст в промпт.
              3. **Generate** — LLM формирует ответ, **опираясь на источники**.

              **Зачем.** Модель получает свежие и приватные знания без дообучения и
              реже выдумывает, потому что отвечает по поданному контексту.
          - id: rag-pipeline-practice
            title: "Испытание: собери RAG-конвейер"
            kind: practice
            xp: 150
            quiz:
              - prompt: "Зачем в RAG этап retrieve?"
                options:
                  - "Достать релевантный контекст для ответа"
                  - "Ускорить токенизацию"
                  - "Сжать модель"
                answer: 0
                explanation: "Retrieve находит релевантные фрагменты, чтобы модель отвечала по фактам из источников, а не по памяти."
          - id: rag-pipeline-boss
            title: "Босс: устрани галлюцинации в ответах"
            kind: boss
            xp: 300
            quiz:
              - prompt: "Что снижает галлюцинации LLM?"
                options:
                  - "Грунтование на найденных источниках"
                  - "Повышение температуры"
                  - "Удаление контекста"
                answer: 0
                explanation: "Грунтование (grounding) ответа на найденных источниках удерживает модель в рамках фактов и снижает выдумки."

  # ── Регион 4: Агенты ─────────────────────────────────────────────────
  - id: agents
    title: "Башня автономных агентов"
    unlock_level: 6
    topics:
      - id: tools
        title: "Инструменты и вызовы"
        prerequisites: ["rag-pipeline"]
        quests:
          - id: tools-theory
            title: "Свиток: вызов инструментов"
            kind: theory
            xp: 50
            body: |
              ## Вызов инструментов
              Сама по себе LLM лишь генерирует текст. **Инструменты** (tools / function
              calling) дают ей руки: модель решает вызвать функцию, передаёт аргументы,
              получает результат и продолжает рассуждение.

              - Инструмент описывается **схемой**: имя, назначение, параметры.
              - Примеры: поиск в вебе, калькулятор, запрос к API, выполнение кода.

              **Так** текстовая модель превращается в **агента**, способного совершать
              действия в реальном мире.
          - id: tools-practice
            title: "Испытание: опиши схему инструмента"
            kind: practice
            xp: 150
            quiz:
              - prompt: "Зачем агенту инструменты (tools)?"
                options:
                  - "Выполнять действия вне модели"
                  - "Увеличить контекст"
                  - "Снизить точность"
                answer: 0
                explanation: "Инструменты позволяют модели действовать за своими пределами — звать API, считать, искать; это и делает её агентом."
      - id: planning
        title: "Планирование"
        prerequisites: ["tools"]
        quests:
          - id: planning-theory
            title: "Свиток: декомпозиция задач"
            kind: theory
            xp: 50
            body: |
              ## Декомпозиция задач
              Сложную цель агент не берёт одним прыжком — он **разбивает её на
              подзадачи** и выполняет по шагам.

              - **Декомпозиция.** «Собрать отчёт» → найти данные → проанализировать →
                оформить.
              - **Подходы.** ReAct (рассуждение + действие), plan-and-execute.
              - На каждом шаге агент проверяет результат и корректирует план.

              **Зачем.** Пошаговость снижает ошибки и делает поведение агента
              управляемым и проверяемым.
          - id: planning-practice
            title: "Испытание: разбей цель на шаги"
            kind: practice
            xp: 150
            quiz:
              - prompt: "Что делает агент на этапе планирования?"
                options:
                  - "Разбивает цель на подзадачи"
                  - "Удаляет память"
                  - "Меняет веса модели"
                answer: 0
                explanation: "Планирование — это декомпозиция цели на выполнимые подзадачи; так агент справляется со сложными задачами."
      - id: multi-agent
        title: "Мультиагентные системы"
        prerequisites: ["planning"]
        events: true
        quests:
          - id: multi-agent-theory
            title: "Свиток: оркестрация агентов"
            kind: theory
            xp: 50
            body: |
              ## Оркестрация агентов
              Вместо одного «универсала» задачу решает **команда специализированных
              агентов**: исследователь, кодер, критик, координатор.

              - **Роли** дают фокус и качество.
              - **Протокол обмена** сообщениями связывает агентов (кто кому что передаёт).
              - **Оркестратор** распределяет работу и собирает итог.

              **Риск.** Без чётких ролей и протокола команда агентов вырождается в
              хаос — поэтому оркестрация и есть ключевой навык.
          - id: multi-agent-practice
            title: "Испытание: спроектируй обмен сообщениями"
            kind: practice
            xp: 150
            quiz:
              - prompt: "В чём смысл мультиагентной системы?"
                options:
                  - "Несколько специализированных агентов решают задачу совместно"
                  - "Один агент работает медленнее"
                  - "Полный отказ от LLM"
                answer: 0
                explanation: "Смысл мультиагентности — разделение труда: специализированные агенты вместе решают то, что одному даётся хуже."
          - id: multi-agent-boss
