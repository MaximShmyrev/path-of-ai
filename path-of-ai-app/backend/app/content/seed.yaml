# Штатный контент «Путь ИИ» (MVP). Источник истины — этот файл (не БД).
# Валидируется при загрузке: уникальные id, DAG пререквизитов, ≥1 practice на тему,
# непустой урок (body) у theory, разбор (explanation) у каждого вопроса квиза,
# неубывающие unlock_level регионов, корректные индексы ответов квизов.

progression:
  base_xp: 100        # порог уровня N = base_xp * (N-1)²
  max_level: 10

# Детерминированный банк сюжетных событий (фоллбэк, когда GLM недоступен).
# Плейсхолдеры: {hero}, {region}, {topic}, {level}.
events_bank:
  - "Туман рассеивается, и {hero} ступает под своды локации «{topic}». Древние руны на стенах тускло мерцают, узнавая искателя знаний."
  - "В сердце региона «{region}» {hero} слышит шёпот забытых алгоритмов. Каждый шаг здесь приближает к мастерству."
  - "Странствующий мудрец кивает {hero}: «Уровень {level} — лишь начало пути. Знание „{topic}“ закалит твой разум сильнее любой стали»."
  - "Факелы вспыхивают сами собой, освещая путь {hero} сквозь «{topic}». Где-то в тенях ждёт испытание, достойное героя."

