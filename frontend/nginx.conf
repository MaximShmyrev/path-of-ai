# Прод-раздача: статика SPA + прокси API на бэкенд (один origin, без CORS).
server {
    listen 80;
    server_name _;

    # Статика фронтенда (SPA-фоллбэк на index.html).
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # Сгенерированные арты и прочие ассеты — обычная статика (см. выше root).

    # API → бэкенд (URI сохраняется: /api/... → backend:8000/api/...).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }
}
