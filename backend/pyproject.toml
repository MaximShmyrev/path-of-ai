[project]
name = "path-of-ai-backend"
version = "0.1.0"
description = "«Путь ИИ» — бэкенд (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "coverage>=7.6",
    # mutmut 2.x: мутирует на месте и гоняет обычный pytest (3.x ломает импорты
    # пакета — копирует в mutants/ только мутируемый файл).
    "mutmut>=2.4,<3",
    "types-pyyaml>=6.0",
    "testcontainers[postgres]>=4.8",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = "testcontainers.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.mutmut]
# Мутируем бизнес-логику ядра (SPEC §8: mutation score ≥ 70% на progression+quests).
# Запуск (mutmut 2.x, конфиг через CLI):
#   uv run mutmut run --paths-to-mutate="app/progression.py,app/quests.py" \
#     --runner="python -m pytest -x -q tests/test_progression.py tests/test_quests.py"
paths_to_mutate = "app/progression.py,app/quests.py"
runner = "python -m pytest -x -q tests/test_progression.py tests/test_quests.py"
